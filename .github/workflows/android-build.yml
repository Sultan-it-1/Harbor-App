name: android-build

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/android-build.yml"

permissions:
  contents: write

# One build per branch at a time: a newer push replaces one still running, so two builds of the
# same branch can't race to publish.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Android APK
    # Ubuntu 26.04 by name: ubuntu-latest becomes it from 19 Oct 2026, so this is the same
    # machine without the switch happening under a build.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS deps
        run: |
          # mpegts.js pulls a dependency straight from GitHub; never try SSH for it.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          pnpm install --frozen-lockfile

      - name: Check Arabic translations
        run: pnpm run check:i18n

      - name: Build web UI
        run: pnpm run build

      - name: Phone smoke test
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm run test:phone

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build APK
        working-directory: android
        env:
          # The release key: the .p12 as base64 and its password, both repository secrets. The base64
          # may be split over HARBOR_KEYSTORE_BASE64, _2 and _3 (a phone pastes 2000 characters at a
          # time); the parts are joined in that order.
          HARBOR_KEYSTORE_BASE64: ${{ secrets.HARBOR_KEYSTORE_BASE64 }}${{ secrets.HARBOR_KEYSTORE_BASE64_2 }}${{ secrets.HARBOR_KEYSTORE_BASE64_3 }}
          HARBOR_KEYSTORE_PASSWORD: ${{ secrets.HARBOR_KEYSTORE_PASSWORD }}
        run: |
          # A debug-signed APK can't update the installed app (Android refuses another key), so
          # without the release key nothing is built or published.
          if [ -z "$HARBOR_KEYSTORE_BASE64" ] || [ -z "$HARBOR_KEYSTORE_PASSWORD" ]; then
            echo "::error::the HARBOR_KEYSTORE_BASE64 and HARBOR_KEYSTORE_PASSWORD secrets must both be set."
            exit 1
          fi
          # Spaces or line breaks from pasting the secret don't matter.
          printf '%s' "$HARBOR_KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/harbor-release.p12" || true
          export HARBOR_KEYSTORE_PATH="$RUNNER_TEMP/harbor-release.p12"
          # Which secret is wrong, said plainly (nothing secret is printed): the key file must be
          # the Harbor release key, and the password must open it.
          KEY_SHA=$(sha256sum "$HARBOR_KEYSTORE_PATH" | cut -d' ' -f1)
          if [ "$KEY_SHA" != "${{ vars.HARBOR_KEY_FILE_SHA256 || '46c398a315b18907be0b17384a36ec75031e1236e92091def84e0a511d859957' }}" ]; then
            echo "::error::HARBOR_KEYSTORE_BASE64 (with _2 and _3) isn't the Harbor key file: it decodes to $(stat -c %s "$HARBOR_KEYSTORE_PATH") bytes of 4296 (sha256 $KEY_SHA). A part is missing or cut short."
            exit 1
          fi
          if ! keytool -list -keystore "$HARBOR_KEYSTORE_PATH" -storetype pkcs12 -storepass:env HARBOR_KEYSTORE_PASSWORD > /dev/null 2>&1; then
            echo "::error::HARBOR_KEYSTORE_PASSWORD doesn't open the Harbor key (the key file itself is right). Set the password again, with no spaces or line break around it."
            exit 1
          fi
          # The version people see is package.json's ("1.0.0"); Android's own number comes from it
          # (1.0.0 -> 10000, 1.2.3 -> 10203), so a newer version always installs over an older one.
          VERSION=$(node -p "require('../package.json').version")
          CODE=$(node -p "const [a,b,c]=require('../package.json').version.split('.').map(Number); a*10000+b*100+c")
          ./gradlew testDebugUnitTest assembleRelease --no-daemon \
            -PharborVersionName="$VERSION" \
            -PharborVersionCode="$CODE"
          # Fixed file name so .../releases/latest/download/harbor-android.apk always works.
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/harbor-android.apk
          echo "HARBOR_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Verify APK
        env:
          # SHA-256 of the Harbor release certificate (alias "harbor"): every APK is signed with the
          # same key. After a key change, set the repository variable HARBOR_CERT_SHA256.
          EXPECTED_CERT: ${{ vars.HARBOR_CERT_SHA256 || '188b66718e6f00d5f0b382f9f2cd86b53250bd59a557a8a9ac4f17258903c620' }}
        run: |
          APK=android/app/build/outputs/apk/release/harbor-android.apk
          SIZE=$(stat -c %s "$APK")
          echo "APK: $SIZE bytes"
          if [ "$SIZE" -lt 5000000 ] || [ "$SIZE" -gt 200000000 ]; then
            echo "::error::unexpected APK size ($SIZE bytes)"
            exit 1
          fi
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          [ -x "$APKSIGNER" ] || APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          if [ "$CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::the APK is not signed with the Harbor release key (certificate $CERT)"
            exit 1
          fi
          echo "HARBOR_APK_SHA256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      # One release a version: pushing without changing package.json's version only builds (the
      # APK is kept with the run below); a new version on main is published as v<version>.
      - name: Is this version new?
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$HARBOR_VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$HARBOR_VERSION is already released: nothing published (raise the version to release)."
            echo "HARBOR_PUBLISH=false" >> "$GITHUB_ENV"
          else
            echo "HARBOR_PUBLISH=true" >> "$GITHUB_ENV"
          fi

      - name: Publish release
        if: github.ref == 'refs/heads/main' && env.HARBOR_PUBLISH == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.HARBOR_VERSION }}
          name: Harbor ${{ env.HARBOR_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          body: |
            Download **harbor-android.apk** below, open it on your phone and allow
            "install from unknown sources" when Android asks.

            SHA-256: `${{ env.HARBOR_APK_SHA256 }}`
          files: android/app/build/outputs/apk/release/harbor-android.apk

      # A copy next to the run (the only copy of a build that isn't a new version). A full artifact
      # quota must not fail the build, and the copy only stays 3 days.
      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: harbor-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 3
